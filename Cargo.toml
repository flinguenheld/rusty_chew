[package]
name = "rusty_chew"
version = "0.1.0"
edition = "2021"

# [[bin]]
# name = "split"
# path = "src/split.rs"

# [[bin]]
# name = "mono"
# path = "src/mono.rs"

[[bin]]
name = "test"
path = "src/mono.rs"

[features]
master = []
slave = []
zero = []
serial = []

[dependencies]
embassy-executor = { version = "0.10", features = [
  "platform-cortex-m",
  "executor-thread",
] }
embassy-rp = { version = "0.10", features = [
  "rp2040",
  "time-driver",
  "critical-section-impl",
] }
embassy-time = "0.5"

cortex-m-rt = "0.7"

defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

smart-leds = "0.4.0"

[profile.release]
debug = 2

[lints.rust]
unused_must_use = "deny" # Raise an error when future is not used
